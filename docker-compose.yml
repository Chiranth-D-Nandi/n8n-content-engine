version: "3.8"

services:
  redis:
    image: redis:7-alpine
    container_name: content_engine_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: content_engine_api
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - APP_ENV=production
      - API_PORT=5000
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - CELERY_ALWAYS_EAGER=false
      - WHISPER_SERVICE_URL=http://whisper:3000
      - VIDEO_GATEWAY_URL=http://video_gateway:8000
      - VIDEO_BACKEND=${VIDEO_BACKEND:-MOCK}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY:-}
      - HF_TOKEN=${HF_TOKEN:-}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
    volumes:
      - app_data:/app/outputs
      - sqlite_data:/app
    depends_on:
      redis:
        condition: service_healthy
      whisper:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  celery_worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    container_name: content_engine_worker
    restart: unless-stopped
    environment:
      - APP_ENV=production
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - CELERY_ALWAYS_EAGER=false
      - WHISPER_SERVICE_URL=http://whisper:3000
      - VIDEO_GATEWAY_URL=http://video_gateway:8000
      - VIDEO_BACKEND=${VIDEO_BACKEND:-MOCK}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY:-}
      - HF_TOKEN=${HF_TOKEN:-}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
    volumes:
      - app_data:/app/outputs
      - sqlite_data:/app
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1G

  whisper:
    build:
      context: .
      dockerfile: docker/Dockerfile.whisper
    container_name: content_engine_whisper
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - BENTOML_PORT=3000
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1G

  video_gateway:
    build:
      context: .
      dockerfile: docker/Dockerfile.video_gateway
    container_name: content_engine_video_gateway
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - VIDEO_BACKEND=${VIDEO_BACKEND:-MOCK}
      - HF_TOKEN=${HF_TOKEN:-}
    volumes:
      - app_data:/app/outputs
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: content_engine_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  grafana:
    image: grafana/grafana:10.4.0
    container_name: content_engine_grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  jaeger:
    image: jaegertracing/all-in-one:1.56
    container_name: content_engine_jaeger
    ports:
      - "16686:16686"  # Web UI
      - "4317:4317"    # OTLP gRPC receiver
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

volumes:
  redis_data:
  app_data:
  sqlite_data:
