services:
  - type: web
    name: matiks-content-engine
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 1 --threads 4 --timeout 300 -b 0.0.0.0:$PORT api:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APP_ENV
        value: production
      - key: VIDEO_BACKEND
        value: MOCK
      - key: CELERY_ALWAYS_EAGER
        value: "true"
      - key: LOW_MEMORY_MODE
        value: "true"
      - key: DATABASE_PATH
        value: /tmp/matiks.db
